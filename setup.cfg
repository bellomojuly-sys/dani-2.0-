[mutmut]
# Mutation testing — "the test of the tests" (D2-020a, extended 25 Nov to every
# product module). mutmut changes the code in thousands of small ways (< into
# <=, True into False, a line removed...) and runs the tests: each change must
# make at least one test fail. Only covered lines are mutated, so the
# `__main__` wiring (marked "pragma: no cover") is left out. Test files are not
# mutated. Run: python3 -m mutmut run && python3 -m mutmut results
source_paths=
    tools.py
    agent.py
    answer.py
    skill.py
    main.py
    tracing.py
    models.py
    reader.py
    chat.py
    context.py
    persona.py
    focus.py
    mood.py
    forecast.py
    briefing.py
    reminders.py
    wake.py
    wake_call.py
    notify.py
    usage.py
    cycle.py
    store.py
    planner.py
    propose.py
    plan_message.py
    delete_events.py
    live.py
    dashboard.py
    render.py
    evals.py
    ical_client.py
    gcal_client.py
    notion_client.py
    telegram_client.py
    twilio_client.py
    memory_store.py
    mail_client.py
    fitbit_client.py
    server.py
also_copy=
    fixtures/
    web/
    data.example/
mutate_only_covered_lines=True
